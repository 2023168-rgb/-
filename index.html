<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>토타디 - 3D 타워 디펜스</title>
<style>
:root{color-scheme:dark;--panel:rgba(12,20,35,.88);--line:rgba(151,190,255,.2);--cyan:#55e5ff;--gold:#ffd66b}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101a2b;color:#f4f7ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
#game{position:fixed;inset:0}canvas{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);box-shadow:0 10px 30px #0005}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
#brand{padding:9px 15px;font-weight:900;font-size:20px;letter-spacing:1px;color:var(--cyan)}
#stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{padding:9px 13px;font-weight:800;font-size:13px}
#left{position:fixed;left:12px;top:76px;width:225px;padding:13px}
h3{font-size:14px;margin:0 0 10px;color:#b8d5ff}
#unitList{display:grid;gap:7px;max-height:43vh;overflow:auto}
.unit{display:flex;align-items:center;gap:8px;text-align:left;width:100%;padding:8px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff09;color:white;cursor:pointer}
.unit.selected{border-color:var(--cyan);background:#55e5ff20}
.unit .emoji{font-size:22px;width:30px;text-align:center}
.unit small{display:block;color:#aab8d1;font-size:11px}
#right{position:fixed;right:12px;top:76px;width:205px;padding:13px}
button{border:1px solid #ffffff20;background:#263b5d;color:white;padding:10px 12px;border-radius:10px;font-weight:800;cursor:pointer}
button:hover{filter:brightness(1.18)}button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:linear-gradient(135deg,#087d9c,#3158a9);border:0}
.gold{background:linear-gradient(135deg,#9a6816,#bd8b2b);border:0;color:#fff7d9}
.action{width:100%;margin:4px 0}
#bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 24px));padding:11px 13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
#hint{font-size:12px;color:#c1cce0;line-height:1.5;flex:1}
#selectedInfo{font-size:12px;color:#d8e8ff;min-height:30px;margin:8px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);padding:10px 16px;background:#0b1527ed;border:1px solid #55e5ff66;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:700;z-index:10}
#modal{position:fixed;inset:0;display:none;place-items:center;background:#0009;z-index:20}
#modal .box{width:min(390px,calc(100vw - 30px));padding:22px;text-align:center}
#modal h2{margin:0 0 8px}.result{font-size:54px;margin:12px}
#waveMsg{color:var(--gold);font-weight:800;font-size:12px;margin:6px 0}
#lobby{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:220px 1fr;grid-template-rows:76px 1fr;gap:14px;padding:14px;background:linear-gradient(90deg,rgba(3,10,20,.78),rgba(3,10,20,.12) 58%,rgba(3,10,20,.35));pointer-events:none}
#lobbyShell{display:contents}#lobbyHeader{grid-column:1/3;grid-row:1;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border:1px solid #8bdcff44;border-radius:18px;background:linear-gradient(90deg,#071728eF,#102d49d9);backdrop-filter:blur(10px);pointer-events:auto}#lobbyHeader h1{font-size:27px;text-shadow:0 3px 14px #000}#lobbyHeader small{font-size:11px}#lobbyNav{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-self:start;gap:8px;padding:12px;border:1px solid #8bdcff44;border-radius:18px;background:#071728dc;backdrop-filter:blur(12px);pointer-events:auto}#lobbyNav button{text-align:left;padding:13px 14px;font-size:14px;border-radius:12px;background:#ffffff0b}#lobbyNav button.active{background:linear-gradient(100deg,#087d9c,#3158a9);border-color:#55e5ff;box-shadow:0 5px 18px #008fb944}#lobbyBody{grid-column:2;grid-row:2;align-self:center;justify-self:end;width:min(700px,100%);max-height:calc(100vh - 110px);overflow:auto;padding:4px;pointer-events:auto}#lobbyBody .lobbyCard{background:linear-gradient(145deg,#0b2038ed,#091426e8);box-shadow:0 12px 35px #0007;backdrop-filter:blur(12px)}
#lobbyHeader{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
#lobbyHeader h1{margin:0;color:#69e6ff;font-size:clamp(24px,4vw,36px)}
#lobbyHeader small{color:#9bb5d1}
#lobbyNav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
#lobbyNav button.active{background:linear-gradient(135deg,#087d9c,#3158a9);border-color:#55e5ff}.lobbyStats{display:flex;gap:8px;flex-wrap:wrap}.lobbyPill{padding:8px 12px;border-radius:12px;background:#ffffff10;border:1px solid #ffffff16;font-weight:800}.lobbyTiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.lobbyTile{padding:15px;border-radius:13px;background:#ffffff0b;border:1px solid #ffffff17;text-align:center}.lobbyTile b{display:block;font-size:22px;margin-bottom:5px}.avatarShow{width:100px;height:100px;margin:8px auto 14px;border-radius:28px;background:linear-gradient(145deg,#1c7191,#303d83);display:grid;place-items:center;font-size:52px;box-shadow:0 12px 30px #0006}.field{width:100%;padding:11px;border-radius:9px;background:#0a1728;color:white;border:1px solid #7896b544;margin:6px 0}@media(max-width:700px){.lobbyTiles{grid-template-columns:repeat(2,1fr)}}
#lobbyBody{min-height:310px}
.lobbyGrid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.lobbyCard{padding:18px;border:1px solid #8eb9e633;border-radius:16px;background:#ffffff09}
.lobbyCard h2{margin:0 0 12px;font-size:19px;color:#d5ecff}
.lobbyMuted{color:#9fb2ca;font-size:13px;line-height:1.7}
.lobbyBig{font-size:34px;font-weight:900;color:#67e4ff;margin:8px 0}
.lobbyAction{width:100%;padding:14px;margin-top:10px;font-size:15px}
.playerLine{display:flex;justify-content:space-between;align-items:center;padding:11px;border-radius:10px;background:#ffffff0b;margin-top:8px}
.playerDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#58df9b;margin-right:8px}
.lobbyEmpty{padding:35px 12px;text-align:center;border:1px dashed #8eb9e655;border-radius:14px;color:#9fb2ca;line-height:1.8}
#top,#left,#right,#bottom{display:none}
@media(max-width:700px){#lobby{grid-template-columns:76px 1fr;grid-template-rows:64px 1fr;padding:7px;gap:7px}#lobbyHeader{padding:7px 10px}#lobbyHeader h1{font-size:19px}#lobbyHeader small{display:none}#lobbyHeader .lobbyMuted{font-size:10px}#lobbyNav{padding:6px;gap:5px}#lobbyNav button{font-size:0;text-align:center;padding:12px 3px}#lobbyNav button:first-letter{font-size:19px}#lobbyBody{max-height:calc(100vh - 82px)}.lobbyGrid{grid-template-columns:1fr}#lobbyBody{min-height:260px}.lobbyCard{padding:12px}.lobbyBig{font-size:26px}} 
@media(max-width:700px){#left{top:auto;bottom:105px;left:8px;width:165px;padding:9px}#right{top:70px;right:8px;width:155px;padding:9px}#unitList{max-height:26vh}.stat{padding:7px 9px;font-size:11px}#brand{font-size:16px;padding:8px}#bottom{bottom:7px;padding:8px}button{padding:8px;font-size:11px}#hint{font-size:10px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="lobby"><div id="lobbyShell"><div id="lobbyHeader"><div><h1>🚽 TOILET TOWER DEFENSE</h1><small>UNIVERSE PLAZA · MAIN LOBBY</small></div><div class="lobbyMuted">🟢 온라인 · <span id="lobbyPlayerCount">1</span>명 표시</div></div><nav id="lobbyNav"><button data-page="home" class="active">🏠 홈</button><button data-page="play">⚔️ 플레이</button><button data-page="summon">✨ 소환</button><button data-page="units">🎒 유닛</button><button data-page="shop">🛒 상점</button><button data-page="collection">📖 도감</button><button data-page="quests">📜 퀘스트</button><button data-page="profile">👤 프로필</button><button data-page="settings">⚙️ 설정</button></nav><main id="lobbyBody"></main></div></div>
<div id="top">
 <div id="brand" class="panel">🚽 토타디 <span style="font-size:10px;color:#9fb4d4">3D DEFENSE</span></div>
 <div id="stats">
  <div class="stat panel">🪙 <span id="coins">500</span></div>
  <div class="stat panel">❤️ <span id="lives">20</span></div>
  <div class="stat panel">🌊 웨이브 <span id="wave">0</span></div>
 </div>
</div>
<aside id="left" class="panel">
 <h3>🧍 내 유닛 보관함</h3>
 <div id="unitList"></div>
 <div id="selectedInfo">유닛을 선택하고 맵의 빈 배치 구역을 눌러!</div>
</aside>
<aside id="right" class="panel">
 <h3>🎮 작전 메뉴</h3>
 <button class="action" id="lobbyBtn">🏠 로비로</button>
 <button class="action gold" id="gacha" disabled>✨ 유닛 소환 (유닛 설정 후)</button>
 <button class="action primary" id="waveBtn">▶ 웨이브 시작</button>
 <button class="action" id="upgrade" disabled>⬆ 선택 유닛 강화</button>
 <button class="action" id="sell" disabled>↩ 선택 유닛 회수</button>
 <button class="action" id="coop">👥 협동 모드</button>
 <div id="waveMsg">배치 후 웨이브를 시작해!</div>
</aside>
<div id="bottom" class="panel">
 <div id="hint">유닛 선택 → 파란 배치 구역 클릭. 유닛은 사거리 안의 적을 자동 공격해.<br>마우스로 드래그해 시점을 돌리고 휠로 확대/축소할 수 있어.</div>
 <button id="reset">↻ 다시 시작</button>
</div>
<div id="toast"></div>
<div id="modal"><div class="box panel"><h2 id="modalTitle">유닛 획득!</h2><div class="result" id="modalEmoji">📷</div><div id="modalName"></div><p id="modalDesc" style="color:#aebdd4;font-size:13px"></p><button class="primary" id="modalClose">확인</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101a2b);scene.fog=new THREE.Fog(0x101a2b,24,48);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(12,17,18);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9e8ff,0x26334b,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-8,15,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(color,rough=.7,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const mats={ground:mat(0x24344a),road:mat(0x596579),edge:mat(0x93a6bd),pad:mat(0x17627b),pad2:mat(0x24bad0),black:mat(0x121b29),white:mat(0xe9f0f8),skin:mat(0xd8a17a),red:mat(0xff5757),blue:mat(0x48bfff),gold:mat(0xffc94f,.35,.25),green:mat(0x50d69a)};
const ground=new THREE.Mesh(new THREE.BoxGeometry(23,.35,17),mats.ground);ground.position.y=-.25;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(23,23,0x45617e,0x344b66);grid.position.y=-.065;scene.add(grid);
const path=[new THREE.Vector3(-10,0,-5),new THREE.Vector3(-4,0,-5),new THREE.Vector3(-4,0,2),new THREE.Vector3(2,0,2),new THREE.Vector3(2,0,-4),new THREE.Vector3(8,0,-4),new THREE.Vector3(8,0,5)];
for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],d=b.clone().sub(a),len=d.length();const road=new THREE.Mesh(new THREE.BoxGeometry(len+.12,.08,2.05),mats.road);road.position.set((a.x+b.x)/2,.005,(a.z+b.z)/2);road.rotation.y=-Math.atan2(d.z,d.x);road.receiveShadow=true;scene.add(road);const stripe=new THREE.Mesh(new THREE.BoxGeometry(len,.012,.07),mat(0xbac8d8));stripe.position.set((a.x+b.x)/2,.055,(a.z+b.z)/2);stripe.rotation.y=road.rotation.y;scene.add(stripe);}
const pads=[[-8,-2],[-6,0],[-2,-3],[-1,4],[0,-1],[4,0],[5,-1],[6,2],[9,1],[-7,4]];
const padMeshes=[];
pads.forEach((p,i)=>{const base=new THREE.Mesh(new THREE.CylinderGeometry(.83,.9,.22,32),mats.pad);base.position.set(p[0],.04,p[1]);base.receiveShadow=true;base.castShadow=true;scene.add(base);const ring=new THREE.Mesh(new THREE.TorusGeometry(.68,.045,8,36),mats.pad2);ring.rotation.x=Math.PI/2;ring.position.set(p[0],.17,p[1]);scene.add(ring);base.userData.padIndex=i;padMeshes.push(base);});
const pathLine=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(path),100,.035,6,false),mat(0xf2c96d));pathLine.position.y=.09;scene.add(pathLine);
const goal=new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,.45,32),mat(0x9b3345));goal.position.set(8,.25,5);scene.add(goal);
const goalRing=new THREE.Mesh(new THREE.TorusGeometry(.9,.08,8,40),mats.gold);goalRing.rotation.x=Math.PI/2;goalRing.position.set(8,.5,5);scene.add(goalRing);

const unitDefs=[];
const SAVE_KEY='totadi_player_v2';
let playerSave={name:'플레이어',coins:500,gems:50,xp:0,level:1,wins:0,selectedMode:'일반',settings:{music:true,effects:true}};
try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(saved&&typeof saved==='object')playerSave={...playerSave,...saved};}catch{}
let coins=playerSave.coins,lives=20,wave=0,selectedUnit=null,selectedTower=null,owned={},towers=[],enemies=[],shots=[],waveActive=false,spawnLeft=0,spawnTimer=0,gameOver=false;
function savePlayer(){playerSave.coins=coins;try{localStorage.setItem(SAVE_KEY,JSON.stringify(playerSave));}catch{}}
function setMode(mode){playerSave.selectedMode=mode;savePlayer();renderLobby('play');}

/* 3D 메인 로비: 기존 전투 맵과 분리된 광장 */
const lobbyScene=new THREE.Scene();
lobbyScene.background=new THREE.Color(0x83c8e8);
lobbyScene.fog=new THREE.Fog(0x83c8e8,48,125);
lobbyScene.add(new THREE.HemisphereLight(0xe8f7ff,0x34465e,2.25));
const lobbySun=new THREE.DirectionalLight(0xfff2d7,2.5);lobbySun.position.set(-24,38,18);lobbySun.castShadow=true;lobbyScene.add(lobbySun);
const lobbyCamera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,220);lobbyCamera.position.set(20,17,27);lobbyCamera.lookAt(0,3,0);
const lobbyMat=(color,rough=.75,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const lobbyM={grass:lobbyMat(0x55a96b),road:lobbyMat(0x46566b),concrete:lobbyMat(0xb7c8d2),blue:lobbyMat(0x1389bb,.3,.25),cyan:lobbyMat(0x5ceaff,.25,.3),gold:lobbyMat(0xffc94d,.3,.25),dark:lobbyMat(0x14243b),white:lobbyMat(0xf3f8ff),red:lobbyMat(0xd94b5b),purple:lobbyMat(0x7656c7),glass:new THREE.MeshStandardMaterial({color:0x5de4ff,metalness:.35,roughness:.15,transparent:true,opacity:.6,emissive:0x125a78})};
const lbox=(p,w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o;};
const lcyl=(p,r1,r2,h,m,x,y,z,n=24)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o;};
const lobbyGround=new THREE.Mesh(new THREE.PlaneGeometry(150,150),lobbyM.grass);lobbyGround.rotation.x=-Math.PI/2;lobbyGround.position.y=-.12;lobbyGround.receiveShadow=true;lobbyScene.add(lobbyGround);
const plaza=new THREE.Mesh(new THREE.CylinderGeometry(25,27,.55,64),lobbyM.concrete);plaza.position.y=.08;plaza.receiveShadow=true;lobbyScene.add(plaza);
const plazaRing=new THREE.Mesh(new THREE.TorusGeometry(23,.22,10,100),lobbyM.gold);plazaRing.rotation.x=Math.PI/2;plazaRing.position.y=.38;lobbyScene.add(plazaRing);
for(let i=0;i<4;i++){const a=i*Math.PI/2;const road=new THREE.Mesh(new THREE.BoxGeometry(58,.18,7),lobbyM.road);road.position.set(0,.02,0);road.rotation.y=a;lobbyScene.add(road);for(let k=-4;k<=4;k++){const dash=lbox(lobbyScene,2,.025,.13,lobbyM.gold,k*6,.12,0);dash.rotation.y=a;}}
/* distant city blocks */
for(let i=0;i<22;i++){const ang=i/22*Math.PI*2,r=39+(i%3)*5,h=7+(i*7%15),w=5+(i%4)*1.3;const b=lbox(lobbyScene,w,h,w,lobbyMat([0x728da5,0x536e8a,0x8b9ead][i%3]),Math.cos(ang)*r,h/2,Math.sin(ang)*r);for(let y=1;y<h-1;y+=2){const win=lbox(lobbyScene,w*.72,.45,.035,lobbyM.glass,b.position.x,y, b.position.z+w/2+.025);win.rotation.y=ang;}}
/* portal gates */
const lobbyPortals=[];
function makePortal(name,x,z,color,icon){const g=new THREE.Group();g.position.set(x,0,z);lobbyScene.add(g);lcyl(g,3.2,3.5,.55,lobbyM.dark,0,.3,0,48);const ring=new THREE.Mesh(new THREE.TorusGeometry(2.1,.22,12,64),lobbyMat(color,.24,.35));ring.position.y=3;g.add(ring);const inner=new THREE.Mesh(new THREE.CircleGeometry(1.88,48),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.22,side:THREE.DoubleSide}));inner.position.set(0,3,0);g.add(inner);lbox(g,.5,3.1,.5,lobbyM.gold,-2.05,1.55,0);lbox(g,.5,3.1,.5,lobbyM.gold,2.05,1.55,0);lbox(g,4.7,.45,.8,lobbyM.dark,0,5.55,0);const labelCanvas=document.createElement('canvas');labelCanvas.width=512;labelCanvas.height=128;const ctx=labelCanvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.font='bold 56px sans-serif';ctx.textAlign='center';ctx.fillText(name,256,78);const tex=new THREE.CanvasTexture(labelCanvas);const sign=new THREE.Mesh(new THREE.PlaneGeometry(4.4,1.05),new THREE.MeshBasicMaterial({map:tex,transparent:true}));sign.position.set(0,5.55,.43);g.add(sign);lobbyPortals.push({group:g,name,ring,color});return g;}
makePortal('BATTLE MATCH',-12,2,0x48caff,'⚔️');makePortal('UNIT SUMMON',0,-12,0xffc94d,'✨');makePortal('TRADING PLAZA',12,2,0xa77aff,'🔁');
/* fountain centre */
const fountain=new THREE.Group();fountain.position.set(0,0,0);lobbyScene.add(fountain);lcyl(fountain,4,4.5,.7,lobbyM.blue,0,.45,0,48);lcyl(fountain,2.6,3,.5,lobbyM.white,0,.95,0,48);lcyl(fountain,.5,.8,2,lobbyM.gold,0,2,0,24);const water=new THREE.Mesh(new THREE.CylinderGeometry(2.7,2.7,.08,48),new THREE.MeshStandardMaterial({color:0x4ccfff,transparent:true,opacity:.65,metalness:.25,roughness:.1}));water.position.y=1.25;fountain.add(water);
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const lamp=lcyl(lobbyScene,.18,.25,3,lobbyM.dark,Math.cos(a)*18,1.5,Math.sin(a)*18,12);lcyl(lobbyScene,.32,.32,.22,lobbyM.gold,Math.cos(a)*18,3.1,Math.sin(a)*18,16);}
/* spawn platform and blocky player avatar */
const spawn=new THREE.Group();spawn.position.set(0,0,10);lobbyScene.add(spawn);lcyl(spawn,1.8,2.1,.35,lobbyM.gold,0,.25,0,32);lcyl(spawn,1.45,1.6,.18,lobbyM.blue,0,.5,0,32);
const avatar=new THREE.Group();avatar.position.set(0,.6,10);lobbyScene.add(avatar);lbox(avatar,.95,1.1,.48,lobbyM.blue,0,1.15,0);lbox(avatar,.78,.72,.7,lobbyM.skin||lobbyMat(0xf0c19a),0,2.1,0);lbox(avatar,.82,.2,.74,lobbyM.dark,0,2.52,0);lbox(avatar,.22,.12,.04,lobbyM.white,-.18,2.14,.37);lbox(avatar,.22,.12,.04,lobbyM.white,.18,2.14,.37);lbox(avatar,.12,.12,.05,lobbyM.dark,-.18,2.14,.4);lbox(avatar,.12,.12,.05,lobbyM.dark,.18,2.14,.4);for(const s of [-1,1]){lbox(avatar,.28,.85,.3,lobbyM.dark,s*.28,.25,0);lbox(avatar,.25,.85,.28,lobbyM.blue,s*.65,1.25,0);}

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let drag=false,lastX=0,lastY=0,orbit={x:12,z:18};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.opacity=0,1800);}
